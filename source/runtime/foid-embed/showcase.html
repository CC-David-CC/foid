<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foid v0.0.1 · beta preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#131a2d;color:#f8f4ff;font-family:system-ui,sans-serif}.card{position:relative;width:600px;height:740px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#394b73 0%,#202d49 47%,#141c30 100%)}.card:before{content:'';position:absolute;inset:16px;border:1px solid #ac8acb55;border-radius:24px}.header{position:absolute;top:35px;left:42px;right:42px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.15em;font-size:14px;font-weight:700;color:#f6d6ed}.badge{border:1px solid #eca3d780;border-radius:30px;padding:7px 12px;font-size:11px}.stage{position:absolute;left:80px;right:80px;top:76px;bottom:85px}.caption{position:absolute;bottom:30px;left:0;right:0;text-align:center}.caption strong{font-size:20px;letter-spacing:.03em}.caption span{display:block;color:#cfc6db;font-size:12px;margin-top:4px;letter-spacing:.1em;text-transform:uppercase}
</style></head><body><div class="card"><div class="header"><span>FOID</span><span class="badge">v0.0.1 · BETA</span></div><div class="stage" id="foid"></div><div class="caption"><strong id="caption">Hello there</strong><span id="detail">a little desktop companion</span></div></div><script type="module">
import {mount} from './index.mjs';const foid=mount(document.querySelector('#foid'));window.showcase={ready:false,done:false};const caption=document.querySelector('#caption'),detail=document.querySelector('#detail'),wait=ms=>new Promise(r=>setTimeout(r,ms));
function reset(){foid.setStatus('idle');foid.setSpeech({speaking:false});foid.setMovement('still');foid.setFacing('front');foid.setExpression('neutral');foid.setLook(0,0);foid.setHeadTilt(0)}
try{await foid.ready;window.showcase.ready=true;await wait(700);foid.gesture('greet');await wait(1800);reset();caption.textContent='A little playful';detail.textContent='expressions & personality';foid.setExpression('teasing');await wait(1700);reset();caption.textContent='A happy moment';detail.textContent='expressions & personality';foid.setExpression('happy');await wait(1600);reset();caption.textContent='Getting things done';detail.textContent='typing · example task';foid.update({tasks:[{id:'showcase-task',phase:'running',label:'Example task'}],summary:'Working on example'});foid.gesture('type',{taskId:'showcase-task'});await wait(2400);reset();caption.textContent='Let’s talk';detail.textContent='simulated mouth movement';foid.setSpeech({speaking:true,viseme:'auto'});await wait(2300);reset();caption.textContent='All ears';detail.textContent='listening & gaze';foid.setStatus('listening');foid.setLook(.45,-.1);foid.setHeadTilt(.2);await wait(1700);reset();caption.textContent='See you soon';detail.textContent='foid · v0.0.1 beta';await wait(1000);window.showcase.done=true}catch(e){window.showcase.error=String(e?.stack??e);console.error(e)}window.addEventListener('pagehide',()=>foid.dispose(),{once:true});
</script></body></html>
