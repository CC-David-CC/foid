<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foid local CLI viewer</title><style>body{margin:0;padding:20px;background:#151b2b;color:#edf2fa;font:16px system-ui}h1{margin:.1em 0}p{line-height:1.45}.space{height:650px;position:relative;background:#202c42;border-radius:12px;overflow:hidden}.host{position:absolute;left:0;bottom:0;width:380px;height:620px;max-width:100%}code{color:#ffc8eb}#status{min-height:2em;color:#c7d8e9}</style></head><body><h1>Foid · local CLI viewer</h1><p>Keep this page and the CLI server open. Use another terminal to send commands; run <code>node cli.mjs help</code> for options.</p><div class="space" id="space"><div class="host" id="host"></div></div><p id="status" role="status">Loading…</p><script type="module">
import {mount,createDesktopWalker} from './index.mjs';const status=document.querySelector('#status'),host=document.querySelector('#host'),foid=mount(host);window.foid=foid;let walker,manualDisconnected=false,talking=false,task=null;
try{await foid.ready;walker=createDesktopWalker({character:foid,container:document.querySelector('#space'),element:host,speed:120,turnDelayMs:300,reverseTurnDelayMs:600});status.textContent='Ready; connecting to local CLI…'}catch(e){status.textContent=`Load failed: ${e.message}`;throw e}
function reset(){manualDisconnected=false;foid.setStatus('idle');foid.setSpeech({speaking:false});foid.setMovement('still');foid.setFacing('front');foid.setExpression('neutral');foid.setLook(0,0);foid.setHeadTilt(0);talking=false;task=null}
function preset(name){reset();switch(name){case 'ready':break;case 'listening':foid.setStatus('listening');foid.setLook(.2,-.1);break;case 'thinking':foid.setStatus('working');foid.setExpression('thinking');foid.setLook(-.3,-.25);break;case 'typing':task={id:'cli-demo-task',phase:'running',label:'CLI example task'};foid.update({tasks:[task],summary:'CLI example task'});foid.gesture('type',{taskId:task.id});break;case 'talking':foid.setSpeech({speaking:true,viseme:'auto'});talking=true;break;case 'waiting':foid.setStatus('waiting');foid.setMovement('fidget');break;case 'celebrate':foid.setExpression('happy');foid.gesture('cheer');break;case 'playful':foid.setExpression('teasing');break;case 'walking':foid.setFacing('right');foid.setMovement('walk');break;case 'resting':foid.setMovement('sleep');break;case 'error':foid.setStatus('error');break}}
function apply(c){const [a,b,label]=c.args;switch(c.name){case 'status':manualDisconnected=a==='disconnected';foid.setStatus(a);break;case 'expression':foid.setExpression(a);break;case 'movement':foid.setMovement(a);break;case 'facing':foid.setFacing(a);break;case 'look':foid.setLook(a,b);break;case 'tilt':foid.setHeadTilt(a);break;case 'blush':foid.setBlush(a);break;case 'energy':foid.setEnergy(a);break;case 'motion':foid.setMotionAmount(a);break;case 'blink':foid.blink();break;case 'reduced':foid.setReducedMotion(a==='on');break;case 'speech':talking=a!=='stop';foid.setSpeech({speaking:talking,viseme:talking?a:'auto'});break;case 'task':task={id:a,phase:b,label};manualDisconnected=false;foid.update({tasks:[task],summary:label});break;case 'gesture':foid.gesture(a,b?{taskId:b}:undefined);break;case 'preset':preset(a);break;case 'travel':walker.walkTo(a).then(r=>{status.textContent=`Travel ${r.reason} at ${Math.round(r.x)} px`}).catch(e=>{status.textContent=`Travel error: ${e.message}`});break}status.textContent=`Applied: ${c.name} ${c.args.join(' ')}`}
const events=new EventSource('/__foid/events');events.addEventListener('ready',()=>{if(!manualDisconnected)foid.update();status.textContent='Connected; ready for CLI commands.';window.foidCliReady=true});events.addEventListener('heartbeat',()=>{if(!manualDisconnected)foid.update()});events.addEventListener('command',event=>{try{apply(JSON.parse(event.data))}catch(e){status.textContent=`Command error: ${e.message}`}});events.onerror=()=>{foid.disconnect();status.textContent='CLI connection lost; waiting to reconnect.'};window.addEventListener('pagehide',()=>{events.close();walker.dispose();foid.dispose()},{once:true});
</script></body></html>
